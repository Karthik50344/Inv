name: inventrix
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.4+4

environment:
  # sqlite3 3.x (hook-based SQLCipher) needs Dart 3.10 / Flutter 3.38 or newer.
  sdk: ^3.10.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_bloc: ^9.1.1
  get_it: ^9.3.0
  drift: ^2.32.0
  drift_flutter: ^0.3.1
  logging: ^1.3.0
  # SQLCipher 4 is bundled through the `hooks` section at the end of this
  # file. Do not add sqlite3_flutter_libs or sqlcipher_flutter_libs.
  sqlite3: ^3.9.0
  uuid: ^4.6.0
  intl: ^0.20.3
  equatable: ^3.0.0
  file_picker: ^13.4.1
  bloc: ^9.2.1
  path: ^1.9.1
  path_provider: ^2.1.5
  # Sales invoices (Phase 5). Ranges are deliberately wide: the versions could
  # not be checked against pub.dev while writing; `flutter pub get` resolves
  # the latest compatible ones.
  pdf: ">=3.11.0 <5.0.0"
  share_plus: ">=11.0.0 <20.0.0"
  # Dashboard and report charts (Phase 9). Wide range for the same reason:
  # pub.dev could not be reached; `flutter pub get` picks a compatible one.
  fl_chart: ">=0.69.0 <3.0.0"
  # Backup and restore (Phase 10). Wide range: pub.dev could not be reached
  # while writing; `flutter pub get` resolves compatible versions. The code
  # was compiled against archive 4.7.1 and crypto 3.0.5.
  archive: ">=4.0.0 <5.0.0"
  crypto: ">=3.0.3 <4.0.0"
  # Database key storage in the Android Keystore / iOS Keychain (database
  # and backup encryption). Needs Android minSdk 24.
  flutter_secure_storage: ^11.2.0
  # AES-256-GCM, HKDF and Argon2id for the encrypted backup container.
  cryptography: ^2.9.0

  material_ui: any
  cupertino_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.32.0
  very_good_analysis: ^10.0.0
  # Branding (redesign Phase 2). Both only generate platform files; they are
  # not linked into the app. Commands are in docs/redesign/branding.md.
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # In-app logos (About / More / settings header). Launcher and splash
  # artwork stays out of the bundle; those files are only generator input.
  assets:
    - assets/branding/inventrix_logo_light.png
    - assets/branding/inventrix_logo_dark.png
    - assets/branding/inventrix_symbol.png
    - assets/branding/inventrix_symbol_dark.png

  # Inter (SIL OFL 1.1), Latin subset, so the type scale works offline.
  # Tabular figures and the rupee sign are kept; other scripts fall back to
  # the system font.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-Medium.otf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ---------------------------------------------------------------------------
# Database encryption: bundle SQLCipher instead of plain SQLite. The app
# refuses to start if the loaded library is not SQLCipher.
# ---------------------------------------------------------------------------
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

# ---------------------------------------------------------------------------
# Launcher icons: dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  # `true` keeps the default `ic_launcher` name, so AndroidManifest.xml
  # (android:icon="@mipmap/ic_launcher") needs no change.
  android: true
  ios: true
  # Full-bleed 1024 px tile: used for iOS and for pre-Android-8 launchers.
  image_path: "assets/branding/inventrix_icon.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  # Android 8+ adaptive icon: indigo background + white/mint mark kept inside
  # the 66 % safe zone, so round, squircle and teardrop masks never crop it.
  adaptive_icon_background: "#4F46E5"
  adaptive_icon_foreground: "assets/branding/inventrix_icon_foreground.png"
  # Android 13+ themed icon (tinted by the wallpaper).
  adaptive_icon_monochrome: "assets/branding/inventrix_icon_monochrome.png"

# ---------------------------------------------------------------------------
# Native splash: dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  android: true
  ios: true
  web: false
  # Light
  color: "#F4F6FB"
  image: assets/branding/inventrix_splash.png
  branding: assets/branding/inventrix_wordmark.png
  branding_mode: bottom
  # Dark
  color_dark: "#0B1220"
  image_dark: assets/branding/inventrix_splash_dark.png
  branding_dark: assets/branding/inventrix_wordmark_dark.png
  # Android 12+ draws the app icon from `image` inside a circle and ignores
  # the branding image, so it gets its own 960 px artwork.
  android_12:
    color: "#F4F6FB"
    image: assets/branding/inventrix_splash_android12.png
    color_dark: "#0B1220"
    image_dark: assets/branding/inventrix_splash_android12_dark.png
