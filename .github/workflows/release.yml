name: Release APK

# Runs when you push a tag such as v1.0.0 (or v1.0.0-beta.1 for a pre-release).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # needed to create the GitHub release

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter 3.35.5
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true

      # Tag v1.2.3 -> version name 1.2.3. The build number is the run number,
      # so every release gets a higher Android versionCode.
      - name: Read version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # Optional: only runs when the signing secrets exist (see notes below).
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            {
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=upload-keystore.jks"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "No signing secrets found; building with the project's default signing."
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: >
          flutter build apk --release
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
             "dist/Inventrix-${{ steps.version.outputs.tag }}.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: Inventrix ${{ steps.version.outputs.tag }}
          files: dist/Inventrix-${{ steps.version.outputs.tag }}.apk
          generate_release_notes: true
          # Tags with a dash (v1.0.0-beta.1) are marked as pre-releases.
          prerelease: ${{ contains(github.ref_name, '-') }}